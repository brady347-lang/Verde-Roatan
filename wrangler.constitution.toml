# Deploys workers/verde-roatan-constitution-worker.js to the EXISTING Cloudflare worker of the same name.
# keep_vars = true keeps the variables you already set in the Cloudflare dashboard
# (PRIMARY_SUPABASE_URL, REVIEW_SUPABASE_URL, VERDE_ADMIN_EMAILS, ...). Secrets are never touched.
name = "verde-roatan-constitution-worker"
main = "workers/verde-roatan-constitution-worker.js"
compatibility_date = "2025-01-01"
keep_vars = true
