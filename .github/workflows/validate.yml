name: Verde Roatan - Validate
on:
  push:
    branches:
      - safety/supabase-target-hardening
      - feature/rootwise-unified-development
      - fix/rootwise-ui-tools-gps-light-v2
  pull_request:
    branches:
      - main
      - feature/rootwise-unified-development
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: order_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ORDER_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/order_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Gemini worker lock
        run: bash scripts/check-gemini-lock.sh
      - name: Cloudflare Worker syntax checks
        run: |
          node --input-type=module --check < workers/verde-roatan-gemini-worker.js
          node --input-type=module --check < workers/verde-roatan-constitution-worker.js
          node --input-type=module --check < workers/verde-botanical-knowledge-core-worker.js
          node --input-type=module --check < workers/verde-roatan-legal-worker.js
      - name: Worker regression tests
        run: npm run test:worker
      - name: Field tool tests (GPS tracking, Android wiring, light meter)
        run: npm run test:field
      - name: Order, payment and inventory database integration tests
        run: npm run test:orders
      - name: TypeScript check
        run: npm run lint
      - name: Production web build
        run: npm run build
