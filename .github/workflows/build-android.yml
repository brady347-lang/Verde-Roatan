
name: Verde Roatan - Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - safety/supabase-target-hardening
      - feature/verde-knowledge-core
      - fix/verde-knowledge-learning
      - feature/rootwise-continuous-intelligence-engine
      - feature/rootwise-unified-development
      - fix/rootwise-ui-tools-gps-light-v2
      - feat/rootwise-field-capture-customer-catalog
      - feat/gps-compass-calibration-live-accuracy

permissions:
  contents: write

jobs:
  android-build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Verde Roatan
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Field sensor and GPS regression tests
        run: npm run test:field

      - name: TypeScript check
        run: npm run lint

      - name: Build React application
        env:
          VITE_BUILD_NUMBER: ${{ github.run_number }}
        run: npm run build

      - name: Create Android project if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Synchronize Capacitor
        run: npx cap sync android

      - name: Harden Gradle distribution download
        run: |
          set -euo pipefail
          WRAPPER=android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's#gradle-8\.11\.1-all\.zip#gradle-8.11.1-bin.zip#' "$WRAPPER"
          if grep -q '^networkTimeout=' "$WRAPPER"; then
            sed -i 's/^networkTimeout=.*/networkTimeout=120000/' "$WRAPPER"
          else
            printf '\\nnetworkTimeout=120000\\n' >> "$WRAPPER"
          fi
          cat "$WRAPPER"

      - name: Install RootWise notification sound resources
        run: |
          set -euo pipefail
          RAW_DIR=android/app/src/main/res/raw
          mkdir -p "$RAW_DIR"
          cp assets/rootwise-notification-sounds/01_rootwise_signature.wav "$RAW_DIR/rootwise_signature.wav"
          cp assets/rootwise-notification-sounds/02_plant_identified.wav "$RAW_DIR/rootwise_plant_identified.wav"
          cp assets/rootwise-notification-sounds/03_landscape_care_reminder.wav "$RAW_DIR/rootwise_care_reminder.wav"
          cp assets/rootwise-notification-sounds/04_important_alert.wav "$RAW_DIR/rootwise_important_alert.wav"
          cp assets/rootwise-notification-sounds/05_knowledge_center_update.wav "$RAW_DIR/rootwise_knowledge_update.wav"
          cp assets/rootwise-notification-sounds/06_saved_success.wav "$RAW_DIR/rootwise_saved_success.wav"
          ls -lh "$RAW_DIR"/rootwise_*.wav

      - name: Use the fixed debug signing key (so updates install over older builds)
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  debug {
                      storeFile file("${rootProject.projectDir}/../android-signing/verde-debug.keystore")
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
          }
          GRADLE

      - name: Stamp an increasing version so new APKs install over old ones
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"2.4.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Build debug APK
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          # Retry only transient distribution/network failures; pipefail preserves Gradle's exit status through tee.
          for attempt in 1 2 3; do
            if ./gradlew assembleDebug 2>&1 | tee /tmp/gradle-build.log; then
              exit 0
            fi
            if ! grep -Eiq 'HTTP (502|503|504)|HTTP response code: (502|503|504)|Gateway Time-out|timed out|Read timed out|Connection reset|UnknownHostException|Temporary failure in name resolution|Could not (GET|HEAD)|Could not download.*gradle' /tmp/gradle-build.log; then
              echo "Gradle failed for a non-network reason; stopping without retry."
              exit 1
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Transient Gradle network failure persisted after 3 attempts."
              exit 1
            fi
            echo "Transient Gradle network failure on attempt $attempt; retrying in $((attempt * 30))s."
            sleep $((attempt * 30))
          done

      - name: Verify merged APK permissions (camera and precise location prompts depend on these)
        run: |
          AAPT2="$(ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/aapt2 | sort -V | tail -1)"
          PERMS="$("$AAPT2" dump permissions android/app/build/outputs/apk/debug/app-debug.apk)"
          echo "$PERMS"
          for p in android.permission.CAMERA android.permission.ACCESS_FINE_LOCATION android.permission.ACCESS_COARSE_LOCATION; do
            echo "$PERMS" | grep -q "$p" || { echo "::error::Merged APK is missing $p"; exit 1; }
          done

      - name: Show APK signing fingerprint (must stay the same on every build)
        run: keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep 'SHA256'

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Verde-Roatan-Android-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
