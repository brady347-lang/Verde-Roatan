
name: Verde Roatan - Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - safety/supabase-target-hardening

permissions:
  contents: read

jobs:
  android-build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Verde Roatan
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run lint

      - name: Build React application
        run: npm run build

      - name: Create Android project if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Synchronize Capacitor
        run: npx cap sync android

      - name: Use the fixed debug signing key (so updates install over older builds)
        run: |
          mkdir -p ~/.android
          cp android-signing/verde-debug.keystore ~/.android/debug.keystore

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Show APK signing fingerprint (must stay the same on every build)
        run: keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep 'SHA256'

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Verde-Roatan-Android-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
