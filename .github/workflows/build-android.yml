
name: Verde Roatan - Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - safety/supabase-target-hardening
      - feature/verde-knowledge-core
      - fix/verde-knowledge-learning
      - feature/rootwise-continuous-intelligence-engine

permissions:
  contents: write

jobs:
  android-build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Verde Roatan
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run lint

      - name: Build React application
        env:
          VITE_BUILD_NUMBER: ${{ github.run_number }}
        run: npm run build

      - name: Create Android project if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Rename approved RootWise icon asset (preserve original bytes)
        shell: bash
        run: |
          set -euo pipefail
          source="branding/file_00000000a2a881f5b2891003f4204cf0.png"
          target="branding/rootwise-icon.png"
          if [ -f "$source" ] && [ ! -f "$target" ]; then
            git mv "$source" "$target"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(rootwise): rename approved app icon"
            git push origin HEAD:feature/rootwise-continuous-intelligence-engine
          elif [ -f "$target" ]; then
            echo "RootWise icon already has its final filename."
          else
            echo "Neither source nor target icon exists; stopping."
            exit 1
          fi

      - name: Synchronize Capacitor
        run: npx cap sync android

      - name: Use the fixed debug signing key (so updates install over older builds)
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  debug {
                      storeFile file("${rootProject.projectDir}/../android-signing/verde-debug.keystore")
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
          }
          GRADLE

      - name: Stamp an increasing version so new APKs install over old ones
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"2.4.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Show APK signing fingerprint (must stay the same on every build)
        run: keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep 'SHA256'

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Verde-Roatan-Android-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK as the latest release (main branch only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Verde-Roatan.apk
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" Verde-Roatan.apk --target "${{ github.sha }}" --latest \
            --title "Verde Roatan 2.4.${{ github.run_number }}" \
            --notes "build_number=${{ github.run_number }}
          $(git log -1 --pretty=%s)"
