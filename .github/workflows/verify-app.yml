name: Verify RootWise app

on:
  push:
    branches: [main, feature/rootwise-unified-development, fix/rootwise-ui-tools-gps-light]
  pull_request:
    branches: [main]

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Field sensor and GPS regression tests
        run: npm run test:field
      - name: TypeScript check
        run: npm run lint
      - name: Production build
        run: npm run build
