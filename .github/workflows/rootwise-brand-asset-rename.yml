name: RootWise - Rename approved app icon

on:
  push:
    branches:
      - feature/rootwise-continuous-intelligence-engine
    paths:
      - .github/workflows/rootwise-brand-asset-rename.yml

permissions:
  contents: write

jobs:
  rename-approved-icon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout existing feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/rootwise-continuous-intelligence-engine
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Rename the existing approved PNG without altering its contents
        shell: bash
        run: |
          set -euo pipefail
          source="branding/file_00000000a2a881f5b2891003f4204cf0.png"
          target="branding/rootwise-icon.png"

          if [ -f "$target" ]; then
            echo "Target already exists; refusing to overwrite it."
            exit 1
          fi

          if [ ! -f "$source" ]; then
            echo "Expected source image is missing: $source"
            exit 1
          fi

          git mv "$source" "$target"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(rootwise): rename approved app icon"
          git push origin HEAD:feature/rootwise-continuous-intelligence-engine
