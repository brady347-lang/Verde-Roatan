name: Verde Roatan - Google Play Bundle (AAB)

# Manual only. Builds the signed .aab file that is uploaded to Google Play Console.
# Needs 4 repository secrets (see docs/GOOGLE_PLAY_RELEASE.md):
#   PLAY_UPLOAD_KEYSTORE_B64, PLAY_UPLOAD_STORE_PASSWORD, PLAY_UPLOAD_KEY_ALIAS, PLAY_UPLOAD_KEY_PASSWORD
# Without them the bundle is still built (unsigned) so the build itself can be tested.

on:
  workflow_dispatch:
  push:
    branches: [feat/google-play-bundle]   # test trigger; removed before merge

permissions:
  contents: read

jobs:
  play-bundle:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.PLAY_UPLOAD_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run lint

      - name: Build React application
        env:
          VITE_BUILD_NUMBER: ${{ github.run_number }}
        run: npm run build

      - name: Create and sync Android project
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Target Android 16 (API 36), required by Google Play since Aug 31 2026
        run: |
          sed -i -E 's/compileSdkVersion *= *[0-9]+/compileSdkVersion = 36/; s/targetSdkVersion *= *[0-9]+/targetSdkVersion = 36/' android/variables.gradle
          cat android/variables.gradle

      - name: Stamp version
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"2.4.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Restore upload key and enable release signing
        if: env.HAS_KEY == 'true'
        env:
          KS_B64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_B64 }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          cat >> android/app/build.gradle <<GRADLE

          android {
              signingConfigs {
                  release {
                      storeFile file("$RUNNER_TEMP/upload.keystore")
                      storePassword System.getenv("PLAY_UPLOAD_STORE_PASSWORD")
                      keyAlias System.getenv("PLAY_UPLOAD_KEY_ALIAS")
                      keyPassword System.getenv("PLAY_UPLOAD_KEY_PASSWORD")
                  }
                  buildTypes { release { signingConfig signingConfigs.release } }
              }
          }
          GRADLE

      - name: Build release bundle
        working-directory: android
        env:
          PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Report signing and target SDK
        run: |
          AAB=$(ls android/app/build/outputs/bundle/release/*.aab)
          echo "Bundle: $AAB"
          jarsigner -verify "$AAB" >/dev/null 2>&1 && echo "SIGNED" || echo "UNSIGNED (add the 4 secrets before uploading to Google Play)"
          unzip -p "$AAB" base/manifest/AndroidManifest.xml | strings | grep -i -m3 "targetSdk\|36" || true

      - uses: actions/upload-artifact@v4
        with:
          name: Verde-Roatan-Play-Bundle
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
